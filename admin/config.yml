backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

locale: fr

collections:

  # ─────────────────────────────────────────────
  # 1. PARAMÈTRES GÉNÉRAUX
  # ─────────────────────────────────────────────
  - name: "parametres"
    label: "⚙️ Paramètres du site"
    files:

      - name: "infos"
        label: "📍 Coordonnées & contact"
        file: "content/infos.json"
        fields:
          - { label: "Nom de l'entreprise", name: "nom", widget: "string", default: "CHARRIERE Bois" }
          - { label: "Téléphone", name: "telephone", widget: "string", default: "05 53 07 94 53" }
          - { label: "Email affiché sur le site", name: "email_affiche", widget: "string" }
          - { label: "Email destination formulaire", name: "email_formulaire", widget: "string", hint: "Les messages du formulaire seront envoyés ici" }
          - { label: "Adresse — Rue", name: "adresse_rue", widget: "string" }
          - { label: "Adresse — Ville", name: "adresse_ville", widget: "string" }
          - { label: "Adresse — Département", name: "adresse_dept", widget: "string" }

      - name: "reseaux"
        label: "📱 Réseaux sociaux"
        file: "content/reseaux.json"
        fields:
          - { label: "Facebook (URL complète)", name: "facebook", widget: "string", required: false }
          - { label: "Instagram (URL complète)", name: "instagram", widget: "string", required: false }
          - { label: "Google Business (URL)", name: "google_business", widget: "string", required: false }

      - name: "horaires"
        label: "🕐 Horaires d'ouverture"
        file: "content/horaires.json"
        fields:
          - { label: "Lundi", name: "lundi", widget: "string" }
          - { label: "Mardi", name: "mardi", widget: "string" }
          - { label: "Mercredi", name: "mercredi", widget: "string" }
          - { label: "Jeudi", name: "jeudi", widget: "string" }
          - { label: "Vendredi", name: "vendredi", widget: "string" }
          - { label: "Samedi", name: "samedi", widget: "string" }
          - { label: "Dimanche", name: "dimanche", widget: "string" }
          - { label: "Message spécial (fermeture, vacances...)", name: "message_special", widget: "string", required: false, hint: "Laisser vide si rien de particulier" }

  # ─────────────────────────────────────────────
  # 2. PAGE D'ACCUEIL
  # ─────────────────────────────────────────────
  - name: "accueil"
    label: "🏠 Page d'accueil"
    files:

      - name: "hero"
        label: "🎬 Bandeau vidéo"
        file: "content/hero.json"
        fields:
          - { label: "Vidéo de fond (.mp4)", name: "video", widget: "file", media_folder: "/assets/video", public_folder: "/assets/video", required: false }
          - { label: "Image de secours (si pas de vidéo)", name: "poster", widget: "image", required: false }
          - { label: "Texte au-dessus du titre", name: "eyebrow", widget: "string" }
          - { label: "Titre ligne 1", name: "titre_ligne1", widget: "string" }
          - { label: "Titre ligne 2 (mis en valeur)", name: "titre_ligne2", widget: "string" }
          - { label: "Année de fondation", name: "annee", widget: "number" }
          - { label: "Sous-titre", name: "sous_titre", widget: "text" }
          - { label: "Bouton principal (texte)", name: "btn1_texte", widget: "string" }
          - { label: "Bouton secondaire (texte)", name: "btn2_texte", widget: "string" }

      - name: "apropos_home"
        label: "👨‍👩‍👧 Bloc À propos"
        file: "content/apropos.json"
        fields:
          - { label: "Photo principale", name: "photo", widget: "image", required: false }
          - { label: "Nombre d'années (badge)", name: "annees", widget: "number" }
          - { label: "Titre", name: "titre", widget: "string" }
          - { label: "Texte descriptif", name: "texte", widget: "text" }
          - label: "Valeurs (3 maximum)"
            name: "valeurs"
            widget: "list"
            max: 3
            fields:
              - { label: "Icône (emoji)", name: "icone", widget: "string" }
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  # ─────────────────────────────────────────────
  # 3. PHOTOS
  # ─────────────────────────────────────────────
  - name: "photos"
    label: "📷 Photos du site"
    files:

      - name: "photos_equipe"
        label: "👥 Équipe"
        file: "content/photos_equipe.json"
        fields:
          - label: "Membres de l'équipe"
            name: "membres"
            widget: "list"
            fields:
              - { label: "Prénom et Nom", name: "nom", widget: "string" }
              - { label: "Fonction", name: "fonction", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Photo", name: "photo", widget: "image", required: false }

      - name: "galerie_atelier"
        label: "🏭 Galerie atelier"
        file: "content/galerie.json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Légende", name: "legende", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }

  # ─────────────────────────────────────────────
  # 4. POPUP & ALERTES
  # ─────────────────────────────────────────────
  - name: "communications"
    label: "📣 Popup & Alertes"
    files:

      - name: "popup"
        label: "💬 Popup d'annonce"
        file: "content/popup.json"
        fields:
          - { label: "Activer le popup", name: "actif", widget: "boolean", default: false }
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Information", value: "info" }
              - { label: "Promotion", value: "promo" }
              - { label: "Alerte / Fermeture", value: "alerte" }
              - { label: "Événement", value: "evenement" }
          - { label: "Titre", name: "titre", widget: "string" }
          - { label: "Contenu", name: "contenu", widget: "text" }
          - { label: "Texte du bouton (optionnel)", name: "btn_texte", widget: "string", required: false }
          - { label: "Lien du bouton", name: "btn_lien", widget: "string", required: false }
          - { label: "Image (optionnel)", name: "image", widget: "image", required: false }
          - { label: "Date de fin (disparaît automatiquement)", name: "date_fin", widget: "datetime", required: false }

      - name: "banniere_alerte"
        label: "🔔 Bandeau d'alerte"
        file: "content/alerte.json"
        fields:
          - { label: "Afficher le bandeau", name: "actif", widget: "boolean", default: false }
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Fermeture exceptionnelle", value: "fermeture" }
              - { label: "Promotion", value: "promo" }
              - { label: "Événement", value: "evenement" }
              - { label: "Information", value: "info" }
          - { label: "Texte du bandeau", name: "texte", widget: "string" }
          - { label: "Lien (optionnel)", name: "lien", widget: "string", required: false }
          - { label: "Texte du lien", name: "lien_texte", widget: "string", required: false }
          - { label: "Date de fin automatique", name: "date_fin", widget: "datetime", required: false }

  # ─────────────────────────────────────────────
  # 5. ÉVÉNEMENTS & ACTUALITÉS
  # ─────────────────────────────────────────────
  - name: "evenements"
    label: "📅 Événements & Actualités"
    label_singular: "Événement"
    folder: "content/evenements"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de l'événement", name: "date", widget: "datetime" }
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - { label: "🏠 Journée Portes Ouvertes", value: "jpo" }
          - { label: "🪚 Atelier / Formation", value: "atelier" }
          - { label: "🎉 Promotion", value: "promo" }
          - { label: "🔒 Fermeture", value: "fermeture" }
          - { label: "📢 Actualité", value: "actu" }
      - { label: "Résumé court (affiché sur la carte)", name: "resume", widget: "text" }
      - { label: "Contenu détaillé (optionnel)", name: "body", widget: "markdown", required: false }
      - { label: "Image (optionnel)", name: "image", widget: "image", required: false }
      - { label: "Mettre en avant sur l'accueil", name: "en_avant", widget: "boolean", default: true, hint: "Cocher pour afficher cet événement sur la page d'accueil" }
